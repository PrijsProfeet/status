<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrijsProfeet status</title>
<meta name="description" content="Actuele beschikbaarheid van prijsprofeet.nl en prijsprofeet.be (website, API en MCP-connector), gemeten van buiten de eigen infrastructuur.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css?v=d55f875803">
<link rel="alternate" type="application/atom+xml" title="Storingen en mededelingen" href="data/incidents.xml" hreflang="nl">
<link rel="alternate" type="application/atom+xml" title="Outages and notices" href="data/incidents.en.xml" hreflang="en">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%232e9e5b'/></svg>">
</head>
<body data-page="index">
<div class="wrap">

  <header>
    <div class="brand">
      <h1 data-t="title">PrijsProfeet status</h1>
      <span class="checked" id="checked"></span>
    </div>
    <!-- Filled by app.js. The links work without it: ?land=be is the whole state. -->
    <nav class="switch" id="country-switch"></nav>
    <!-- A language choice per country, shown once a country has more than one
         (French on prijsprofeet.be, prijsprofeet#1568). -->
    <nav class="switch" id="lang-switch" hidden></nav>
  </header>

  <!-- Ships with the "no data" state, not an optimistic green one: if the
       JSON never arrives, the page must not sit there claiming all is well. -->
  <div class="banner" id="banner" data-status="none">
    <span class="dot"></span>
    <span class="banner-text" data-t="loading"></span>
  </div>

  <section class="notices" id="notices" hidden></section>

  <!-- For visitors: one storefront at a time, in the visitor's language. -->
  <main id="services"></main>

  <section class="sla" id="freshness" hidden>
    <h2 data-t="freshness_title"></h2>
    <p class="sla-note" data-t="freshness_note"></p>
    <div id="freshness-tables"></div>
  </section>

  <section class="incidents" id="incidents" hidden>
    <h2 data-t="incidents_title"></h2>
    <p class="incidents-note" data-t="incidents_note"></p>
    <ul id="incidents-list"></ul>
  </section>

  <!-- For API customers: the API and SLA of the chosen storefront's host, with
       a pointer to the country switch. One key works on every host (prijsprofeet#1131),
       but most customers use one, and the list grows with every country. -->
  <section class="business" id="business">
    <h2 data-t="business_title"></h2>
    <p class="sla-note" data-t="business_note"></p>
    <div class="panel" id="api-rows"></div>

    <div class="sla" id="sla" hidden>
      <h3 class="sla-title" data-t="sla_title"></h3>
      <p class="sla-note"><span data-t="sla_note"></span>
        <a href="https://www.prijsprofeet.nl/api-voorwaarden" rel="noopener" data-t="sla_terms"></a></p>
      <div id="sla-tables"></div>
    </div>
    <p class="sla-note other-hosts" data-t="other_country"></p>
  </section>

  <footer>
    <span data-t="footer"></span>
    <a href="data/incidents.xml" data-t="footer_feed" id="feed-link"></a>
    <span class="build" id="build"></span>
  </footer>

</div>
<script src="app.js?v=5a1f55914f"></script>
<!-- Umami (own site id). async, so a box that is down cannot hold up the page:
     the tracker then simply does not load. -->
<script async src="https://www.prijsprofeet.nl/pp-metrics.js" data-website-id="51323e37-aae3-47df-952c-aa9b8076408e" data-host-url="https://www.prijsprofeet.nl"></script>
</body>
</html>
