name: Probe

on:
  schedule:
    # Best-effort cadence — GitHub can delay a scheduled run under load, so
    # this is a display refresh rate, not a measurement interval. The
    # contractual SLA (blackbox-exporter, every 30s) is unaffected either way.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/status.json"

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python3 collector/probe.py

      - name: Commit updated status
        run: |
          git config user.name "prijsprofeet-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json
          git diff --cached --quiet && exit 0
          git commit -m "status: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A scheduled run every 5 minutes will occasionally race a manual
          # push; rebase-and-retry once rather than failing the whole run.
          for i in 1 2 3; do
            git push && break
            git pull --rebase && git push && break
          done
